name: CI

on:
  pull_request:
  # main pushes run this same CI through deploy-cloudflare.yml before deployment.
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # 測試打真的 PostGIS（places 的 ST_DWithin 查詢）
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@localhost:5433/app
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本讀根 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:prototype
      - run: pnpm db:push && pnpm db:seed
      - run: pnpm test
      - run: pnpm test:tooling
      - run: pnpm build
      - run: pnpm test:platform
      - run: pnpm exec wrangler deploy --dry-run --outdir .artifacts/worker --var BUILD_SHA:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: friendly-platform-${{ github.sha }}
          path: |
            apps/web/dist/
            .artifacts/worker/
            data/friendly/manifest.json
          include-hidden-files: true
          retention-days: 7
