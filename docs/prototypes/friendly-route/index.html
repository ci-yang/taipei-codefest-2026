<!doctype html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1f3f4">
  <meta name="description" content="友善同行，尋找身邊的廁所、充電、Wi-Fi 與無障礙資源，離線也能查看。">
  <title>友善同行 · 身邊的城市資源</title>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./app-ui.css">
  <link rel="stylesheet" href="./highlights.css">
  <link rel="stylesheet" href="./speak-card.css">
</head>
<body>
<main id="app" class="friendly-app" data-view="home" aria-label="友善同行資源地圖">
  <section id="home-screen" class="home-screen" aria-labelledby="home-heading">
    <header class="home-header">
      <p class="home-eyebrow">救急按鈕</p>
      <h1 id="home-heading">現在最急的是？</h1>
      <div class="home-location"><span id="home-location" class="home-location-text" aria-live="polite">正在定位…</span><button id="home-gps" class="text-button" type="button" data-action="gps"><span data-icon="location"></span>重新定位</button></div>
    </header>
    <div class="urgency-buttons board" role="group" aria-label="找最近的友善資源">
      <button class="urgency-button" type="button" data-urgency="toilet"><span class="unit" aria-hidden="true"><span class="collar"></span><span class="stem"></span><span class="dome" data-icon="toilet"></span></span><span class="urgency-copy"><span class="lbl">廁所</span><small>找最近的公廁</small></span></button>
      <button class="urgency-button" type="button" data-urgency="charge"><span class="unit" aria-hidden="true"><span class="collar"></span><span class="stem"></span><span class="dome" data-icon="charge"></span></span><span class="urgency-copy"><span class="lbl">充電</span><small>找最近的充電點</small></span></button>
      <button class="urgency-button" type="button" data-urgency="wifi"><span class="unit" aria-hidden="true"><span class="collar"></span><span class="stem"></span><span class="dome" data-icon="wifi"></span></span><span class="urgency-copy"><span class="lbl">網路</span><small>找最近的免費 Wi-Fi</small></span></button>
    </div>
    <footer class="home-footer">
      <div class="home-links"><button id="home-map" class="secondary-button" type="button"><span data-icon="compass"></span>看地圖</button><button id="home-settings" class="secondary-button" type="button"><span data-icon="settings"></span>設定</button></div>
      <p class="home-note">直線距離挑最近一筆 · 臺北市開放資料 · <span id="home-cache" aria-live="polite">準備離線資料</span></p>
    </footer>
  </section>

  <section id="result-screen" class="result-screen" aria-labelledby="result-title" hidden>
    <header class="result-header"><button id="result-back" class="icon-button" type="button" aria-label="返回" data-icon="arrowLeft"></button><h1 id="result-title">最近的資源</h1></header>
    <div id="result-body" class="result-body" aria-live="polite"></div>
  </section>

  <section id="explore-screen" class="explore-screen" aria-label="探索友善資源" hidden>
    <div id="map-stage" class="map-stage">
      <div id="map" aria-label="臺北友善資源地圖"></div>
      <header class="app-header">
        <button id="map-back" class="icon-button" type="button" aria-label="返回" data-icon="arrowLeft"></button>
        <button id="search-trigger" class="search-trigger" type="button"><span data-icon="search"></span><span id="search-label">搜尋地點或店家…</span></button>
      </header>
      <button id="gps-button" class="map-tool location-tool" type="button" aria-label="重新取得目前位置" data-icon="location"></button>
      <button id="map-expand" class="map-tool expand-tool" type="button" aria-expanded="false" aria-controls="map-stage" aria-label="展開地圖"><span data-icon="compass"></span><span id="map-expand-label">展開地圖</span></button>
      <div id="map-status" class="map-status">
        <span id="location-status" class="map-status-pill" aria-live="polite">正在取得目前位置…</span>
        <button id="destination-clear" class="destination-pill" type="button" hidden><span data-icon="flag"></span><span id="destination-name"></span><span data-icon="close"></span></button>
      </div>
      <p id="basemap-notice" class="basemap-notice" role="status" hidden>此區尚無離線底圖，可查看資源與直線距離</p>
      <header id="guidance-header" class="guidance-header">
        <button id="exit-guidance" class="icon-button" type="button" aria-label="返回" data-icon="arrowLeft"></button>
        <div><p class="guidance-eyebrow">帶我去</p><h1 id="guidance-heading">身邊的友善導引</h1></div>
      </header>
      <section id="guidance-hud" class="guidance-hud" aria-label="方向與距離">
        <div class="guidance-main">
          <span id="guide-arrow" class="guide-arrow" aria-hidden="true"><span data-icon="arrowNorth"></span></span>
          <div><h2 id="guidance-title">探索附近資源</h2><p id="guidance-distance" class="guidance-distance" aria-live="polite">等待定位</p><p id="guide-walk" class="guide-walk" aria-live="polite" hidden></p></div>
        </div>
        <p id="guidance-bearing" class="guidance-bearing">需要定位才能顯示方向</p>
        <div class="guidance-location-row"><span id="guidance-location" aria-live="polite">正在取得目前位置…</span><button id="guide-orientation" class="text-button" type="button" data-action="orientation">啟用方位感測</button><button id="guide-retry" class="text-button" type="button" hidden>重算步行路線</button><button id="guidance-detail" class="text-button" type="button" hidden>資源資訊<span data-icon="chevron"></span></button></div>
      </section>
      <div id="guidance-controls" class="guidance-controls">
        <p id="guide-timer-status" class="guide-timer-status" role="status" hidden></p>
        <section id="guide-timer" class="guide-timer" aria-label="導引附加工具" hidden></section>
        <div class="guidance-buttons">
          <button id="guidance-resources" class="guidance-resource-button" type="button"><span data-icon="all"></span>附近資源<span data-icon="chevron"></span></button>
          <button id="guidance-end" class="guidance-end" type="button"><span data-icon="close"></span>結束導引</button>
        </div>
      </div>
    </div>

    <section id="bottom-panel" class="map-panel" aria-label="附近資源">
      <div class="panel-toolbar"><span id="panel-summary">附近資源</span><button id="panel-toggle" class="icon-button panel-toggle" type="button" aria-expanded="true" aria-controls="panel-content"><span id="panel-toggle-label" class="sr-only">收合面板</span><span data-icon="chevron"></span></button></div>
      <div id="panel-content">
      <section id="highlight-host" aria-label="城市生存雷達"></section>
      <section id="destination-route" class="destination-route" aria-label="目的地步行路線" hidden>
        <div class="destination-route-heading"><span data-icon="route"></span><strong>目的地步行路線</strong><button id="route-retry" class="text-button" type="button" hidden>重新計算</button></div>
        <p id="destination-route-message" class="destination-route-message" role="status"></p>
        <p id="destination-route-note" class="field-note">本機路網限信義區與大安東側。</p>
      </section>
      <div id="category-filters" class="filters" role="group" aria-label="資源類別，可多選"></div>
      <h2 id="panel-heading" class="sr-only">附近資源</h2>
      <div class="panel-meta"><p id="location-notice" class="location-notice" role="status"></p><span id="visible-count" aria-live="polite"></span><button id="list-button" class="text-button" type="button" hidden><span id="list-button-label">全部</span><span data-icon="chevron"></span></button></div>
      <div id="nearby-preview" class="preview-list"></div>
      <article id="selected-card" hidden></article>
      <footer class="explore-footer">
        <div class="footer-actions"><button id="home-button" class="text-button footer-action" type="button"><span data-icon="arrowLeft"></span>回首頁</button><button id="overview-button" class="text-button footer-action" type="button"><span data-icon="compass"></span>全市範圍</button><button id="highlight-map-launch" class="text-button footer-action" type="button"><span data-icon="location"></span>城市雷達</button><button id="settings-button" class="text-button footer-action" type="button"><span data-icon="settings"></span>設定</button></div>
        <div class="footer-status"><span id="network-label" class="connection-label" aria-live="polite"></span><span id="cache-status" aria-live="polite">準備離線資料</span></div>
      </footer>
      </div>
    </section>
  </section>
</main>
<dialog id="app-sheet" class="app-sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="sheet-title"></h2><button id="sheet-close" class="sheet-close" type="button" aria-label="關閉" data-icon="close"></button></header><div id="sheet-body" class="sheet-body"></div></dialog>
<div id="toast" class="app-toast" role="status" hidden></div>
<noscript>請開啟 JavaScript，才能使用資源地圖。</noscript>
<script src="./vendor/leaflet.js"></script>
<script src="./data.js"></script>
<script src="./resources-data.js"></script>
<script src="./icons.js"></script>
<script src="./search.js"></script>
<script src="./bridge.js"></script>
<script src="./offline.js"></script>
<script src="./route-client.js"></script>
<script src="./highlight-math.js"></script>
<script src="./price-data.js"></script>
<script src="./urgency.js"></script>
<script src="./highlights.js"></script>
<script src="./speak-card-strings.js"></script>
<script src="./speak-card.js"></script>
<script src="./app.js"></script>
</body>
</html>
