<!doctype html>
<html lang="zh-Hant-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171d19">
  <meta name="description" content="友善同行，尋找身邊的廁所、充電、Wi-Fi 與無障礙資源，離線也能查看。">
  <title>友善同行 · 身邊的城市資源</title>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./app-ui.css">
</head>
<body>
<main id="app" class="friendly-app" aria-label="友善同行資源地圖">
  <div id="map" aria-label="臺北友善資源地圖"></div>
  <header class="app-header">
    <div class="brand-row"><a href="#" class="brand" id="home-button" aria-label="友善同行，回到地圖"><span class="brand-symbol" data-icon="navigation"></span><span>友善同行</span></a><span id="network-label" class="connection-label" aria-live="polite"></span><button id="settings-button" class="icon-button settings-button" aria-label="地圖設定" data-icon="settings"></button></div>
    <button id="search-trigger" class="search-trigger"><span data-icon="search"></span><span id="search-label">想去哪裡？</span><span data-icon="arrowUpRight" class="muted"></span></button>
  </header>
  <div class="map-status"><span id="location-status" class="map-status-pill" aria-live="polite">正在取得目前位置…</span><span id="cache-status" class="map-status-pill" aria-live="polite">準備離線資料</span><button id="destination-clear" class="destination-pill" hidden><span data-icon="flag"></span><span id="destination-name"></span><span data-icon="close"></span></button></div>
  <div class="map-tools"><button id="overview-button" class="map-tool" aria-label="查看台北資源範圍" data-icon="compass"></button><button id="gps-button" class="map-tool location-tool" aria-label="重新取得目前位置" data-icon="location"></button></div>
  <section id="bottom-panel" class="map-panel" aria-label="附近資源">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="nearby-heading"><div><p id="location-kicker" class="location-kicker">臺北資源地圖</p><h1 id="panel-heading">友善，就在身邊</h1></div><button id="list-button" class="text-button">清單 <span data-icon="chevron"></span></button></div>
    <div id="category-filters" class="filters" aria-label="資源類別"></div>
    <div class="category-selection-note"><span>可多選 · 任一符合</span><span id="visible-count" aria-live="polite"></span></div>
    <div id="location-notice" class="location-notice" role="status"></div>
    <div id="nearby-preview" class="preview-list"></div>
    <article id="selected-card" hidden></article>
  </section>
</main>
<dialog id="app-sheet" class="app-sheet" aria-labelledby="sheet-title"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="sheet-title"></h2><button id="sheet-close" class="sheet-close" aria-label="關閉" data-icon="close"></button></header><div id="sheet-body" class="sheet-body"></div></dialog>
<div id="toast" class="app-toast" role="status" hidden></div>
<noscript>請開啟 JavaScript，才能使用資源地圖。</noscript>
<script src="./vendor/leaflet.js"></script>
<script src="./data.js"></script>
<script src="./resources-data.js"></script>
<script src="./icons.js"></script>
<script src="./search.js"></script>
<script src="./bridge.js"></script>
<script src="./offline.js"></script>
<script src="./app.js"></script>
</body>
</html>
