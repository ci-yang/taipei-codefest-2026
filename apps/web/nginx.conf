server {
  listen 80;
  root /usr/share/nginx/html;

  # nginx 預設不認得 .mjs；MapLibre 的 module worker 一定要 JavaScript MIME，否則地圖空白
  location ~* \.mjs$ { types { application/javascript mjs; } }

  # API 與 healthz 反代到 compose 裡的 api 服務（同源，免 CORS）
  location /api/ { proxy_pass http://api-prod:8787; proxy_set_header Host $host; }
  location = /healthz { proxy_pass http://api-prod:8787; }

  # vue-router history mode
  location / { try_files $uri $uri/ /index.html; }
}
