          source: proposal.md:68
        - id: US-6.1
          story_id: US-6
          text: WHEN 我開啟首頁並允許定位，THEN 地圖標示裝置回傳的目前位置、定位精度與取得時間，行程設定的起點預設使用此位置，不將展示座標標成 GPS。
          source: proposal.md:74
        - id: US-6.2
          story_id: US-6
          text: WHEN 我在首頁按「開始」，THEN 進入行程設定頁，再依序進入路線確認及行程地圖；每頁有明確主要操作及返回入口，不同頁的全部表單不堆在同一畫面。
          source: proposal.md:75
        - id: US-6.3
          story_id: US-6
          text: WHEN 定位被拒、逾時、不支援或精度不足，THEN 顯示相應狀態、重新定位及手動選起點入口；沒有有效位置時不顯示定位成功。
