        - id: US-6.4
          story_id: US-6
          text: WHEN 真實位置在示範資料或可用路網範圍外，THEN
            保留真實位置與範圍提示，停止以該起點建立建議路線；只有我主動選擇示範起點才切換，且持續標明示範。
          source: proposal.md:77
        - id: US-7.1
          story_id: US-7
          text: WHEN 我進入行程設定頁，THEN 可選日期、歷史路線、起點及目的地；新行程預設裝置當日日期與可用的目前位置，畫面不依選定日期宣稱店家正在營業。
