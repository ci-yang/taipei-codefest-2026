  revisions:
    - revision: 1
      digest: 5f24e004331f71310636d8397d4408a4ab07168ed871cdb761bf966c9cdc7d50
      captured_at: 2026-11-07T04:28:05.873Z
      captured_status: story
      origin: story
      reason: initial freeze
      scenarios:
        - id: US-1.1
          story_id: US-1
          text: WHEN 我選擇充電、無障礙友善、友善廁所或 Free WiFi 的一項或多項，THEN
            地圖與清單同步呈現符合已標示項目的店家，並明示多選為「任一符合」。
          source: proposal.md:30
        - id: US-1.2
          story_id: US-1
          text: WHEN 我查看店家，THEN
            顯示名稱、地址、服務標記、來源與資料日期；空白標記顯示「未標示」，未確認條件顯示「待確認」，不宣稱免費免消費或目前可用。
          source: proposal.md:31
        - id: US-1.3
          story_id: US-1
          text: WHEN 篩選沒有結果，THEN 顯示零筆與清除篩選入口，保留我的路線。
          source: proposal.md:32
        - id: US-2.1
          story_id: US-2
          text: WHEN 我輸入有效起點與 1–5 個目的地並建立路線，THEN 依輸入順序顯示各站、連接線與沿途店家類別；可增刪目的地後重建。
          source: proposal.md:38
        - id: US-2.2
          story_id: US-2
          text: WHEN 地址無法辨識或目的地超過上限，THEN 指出需修正的欄位並保留其他輸入，不以任意座標替代。
          source: proposal.md:39
        - id: US-2.3
          story_id: US-2
          text: WHEN 路線未經可行路網驗證，THEN 明示「示意路徑，不能用於導航」，距離標為直線估算；店家無障礙標記不轉為「無障礙路線」保證。
          source: proposal.md:40
        - id: US-3.1
          story_id: US-3
          text: WHEN 店家尚無回報，THEN
            顯示「尚無回報」；有順利回報且無問題回報則標「有順利回報」；存在條件有限或未能使用的回報則標「需再確認」，各級皆有文字與圖示。
          source: proposal.md:46
        - id: US-3.2
          story_id: US-3
          text: WHEN 我提交服務類別、使用結果及文字回報，THEN 顯示其日期與來源，更新該服務的數量和等級；保留各結果數量，不以總分掩蓋問題。
          source: proposal.md:47
        - id: US-3.3
          story_id: US-3
          text: WHEN 回報只存在本機或尚未查證，THEN 明示其狀態，不顯示為其他人評論或官方認證，並提供刪除自己回報與檢舉入口。
          source: proposal.md:48
        - id: US-4.1
          story_id: US-4
          text: WHEN 我調整沿途範圍，THEN 顯示距路徑指定直線距離內的候選點；圖例明示這是資源搜尋範圍，不是 WiFi 訊號、可步行範圍或救援保證。
          source: proposal.md:54
        - id: US-4.2
          story_id: US-4
          text: WHEN 我要求儲存路線，THEN 涵蓋範圍的底圖、路線、店家資料與重開頁面所需內容全部保存成功才顯示完成；任何一項失敗都不顯示「已快取」。
          source: proposal.md:55
        - id: US-4.3
          story_id: US-4
          text: WHEN 我完成儲存後斷網並重開頁面，THEN 自動顯示已存底圖、路線與店家資料，列出儲存時間及涵蓋範圍，並保留服務不保證現場可用的提示。
          source: proposal.md:56
        - id: US-4.4
          story_id: US-4
          text: WHEN 沒有已存內容、僅部分保存成功或要求範圍外的新路線，THEN 說明缺少離線資料，不假裝新路線已完成；保留仍可讀的內容。
          source: proposal.md:57
        - id: US-5.1
          story_id: US-5
          text: WHEN 我選好需求與求助點準備發布，THEN
            先預覽將公開的資料，再要求我明確同意；路線分享預設關閉，未勾選時不包含路線，勾選時須另外確認欲公開路段；只有服務確認接收後才顯示「已發布」，不自動分享住家、完整行程或持續定位。
          source: proposal.md:63
        - id: US-5.2
          story_id: US-5
          text: WHEN 另一位市民查看有效請求，THEN 只看到已同意的需求、地點、路段與到期時間，可回覆願意協助；回覆不等於協助者已到達或資源保證可取得。
          source: proposal.md:64
        - id: US-5.3
          story_id: US-5
          text: WHEN 我取消、結束或請求到期，THEN 其他市民不再看到有效求助點；斷網取消顯示「取消待確認」，不假稱已撤回。
          source: proposal.md:65
        - id: US-5.4
          story_id: US-5
          text: WHEN 發布時斷網或連線失敗，THEN 請求留為未送出的草稿，不顯示已送達；重新連線後仍需再次確認才送出；僅偵測到網路不宣稱一定使用 WiFi。
          source: proposal.md:66
premise_version: 1
retry_of: []
