          text: WHEN 我按底部類別鈕（離線時亦可用；廁所、充電、Wi-Fi、無障礙，類別可擴充；Wi-Fi＝名冊 Wi-Fi
            標記店家加公眾區免費無線上網熱點的聯集；熱點卡片顯示熱點名稱、地址、來源，無電話不顯示撥號），THEN 地圖 highlight
            該類店家：初始顯示全部點位（一般樣式），選類別後符合者放大、加亮、加類別圖示，不符合者降低不透明度但不移除；再按一次取消；可同時選多類，明示多選為「任一符合」；「範圍」指目前地圖視窗，該範圍無符合者時顯示零筆。
          source: proposal.md:37
        - id: US-1.7
          story_id: US-1
          text: WHEN 我點選店家，THEN
            顯示卡片：名稱、距離（一律為直線距離，畫面統一標「直線距離（非步行路線）」，線上離線同一規則）、類別、資料來源與更新日；空白標記顯示「未標示」，未確認條件顯示「待確認」，不宣稱免費免消費或目前可用。
          source: proposal.md:38
        - id: US-1.8
          story_id: US-1
          text: WHEN 卡片資料含電話，THEN 顯示「撥號」並透過 TownPass bridge `phone_call` 撥出；無電話欄位則不顯示該按鈕。
          source: proposal.md:39
        - id: US-1.9
          story_id: US-1
          text: WHEN 我按卡片上的「導航」，THEN 透過 TownPass bridge `launch_map` 傳入
            `geo:<lat>,<lon>?q=<lat>,<lon>(<店名 URL encode>)` URI，交給裝置預設地圖
            App；不得寫死 Google 或 Apple Maps 網址。geo URI 回 false 或逾時（5 秒）時，以
            `launch_map` 再送一次 OSM 網址
            `https://www.openstreetmap.org/?mlat=<lat>&mlon=<lon>#map=18/<lat>/<lon>`。
          source: proposal.md:40
        - id: US-1.10
          story_id: US-1
          text: WHEN OSM 網址也回 false 或逾時（5 秒，規格設定值；bridge 文件為一定回覆，逾時只是防呆），THEN
            顯示「無法開啟外部地圖」並保留地址可複製，不顯示已開啟。`phone_call` 回 false
            或逾時即顯示「無法撥號」並保留電話可複製。
          source: proposal.md:41
        - id: US-1.11
          story_id: US-1
          text: WHEN flutterObject 不存在（一般瀏覽器），THEN 導航與撥號按鈕仍顯示，按下後說明「需在台北通 App
            內使用」，保留地址與電話可複製，不呼叫 postMessage。
          source: proposal.md:42
        - id: US-2.1
          story_id: US-2
          text: WHEN 我設定有效起點與依序經過的 1–5 個目的地並按下一步，THEN
            進入獨立確認頁，顯示可用路線、各站順序、距離、符合需求的沿線店家數與類別。
          source: proposal.md:49
        - id: US-2.2
          story_id: US-2
          text: WHEN 系統提出「最短路徑」及「資源最多」方案，THEN
            最短明示限定本次可用路網；資源最多明示限定本次產生的候選，按相同需求與距離範圍計算不重複店家數，並呈現兩者的距離與資源差異。
          source: proposal.md:50
        - id: US-2.3
          story_id: US-2
          text: WHEN 地點需要接至可用路網，THEN 只允許每段不超過 120 m（規格設定值，見 input-evidence.md
            本輪修訂來源，非實測）的端點接線，另列接線距離並納入總距離，標示接線未驗證現場通行；超限即拒絕該地點並提供修改入口。
          source: proposal.md:51
        - id: US-2.4
          story_id: US-2
          text: WHEN 地點無法辨識、超出路網、路段不連通或沒有不同的替代方案，THEN
            說明原因與可修改項目，不以直線跨越不連通路段、不捏造第二條路線；原型路線不保證現場通行或無障礙。
          source: proposal.md:52
        - id: US-4.1
          story_id: US-4
          text: WHEN 首次有網路開啟，THEN
            自動快取全市店家點位與類別（不只某條路線範圍）；底圖快取以目前視窗附近為限，並明示底圖涵蓋範圍；快取進行中顯示進度。
          source: proposal.md:58
        - id: US-4.2
          story_id: US-4
          text: WHEN 全市點位、類別資料與頁面本身都快取成功，THEN
            才顯示「已快取」及儲存時間與底圖涵蓋範圍；任何一項快取失敗都不得顯示「已快取」，並說明缺哪一項。
          source: proposal.md:59
        - id: US-4.3
          story_id: US-4
          text: WHEN 斷網並重開頁面，THEN 仍可定位、按類別鈕
            highlight、點店家看卡片，並以直線計算距離與方位；底圖範圍外只顯示店家點位，不假裝有底圖。
          source: proposal.md:60
        - id: US-4.4
          story_id: US-4
          text: WHEN 斷網且目前位置沒有底圖，THEN 提供「方向與距離」導引畫面：文字寫成「店家在您的東北方（以正北為基準），約 120
            公尺」（數字僅為示意），不需羅盤也能顯示；有方位感測時才轉動大箭頭指向所選店家，不需要路網；無方位感測時，畫面上方視為正北，靜態箭頭指向店家方位角，並標「以正北為基準」。沒有有效定位時不顯示箭頭，只顯示「需要定位才能指向」與重新定位入口；方位感測不可用或被拒時，保留方位文字與距離並說明。
          source: proposal.md:61
        - id: US-4.5
          story_id: US-4
          text: WHEN 斷網時按「導航」或「撥號」，THEN
            說明依賴外部程式或通話功能、可能無法使用，保留方向與距離導引及電話號碼供手動撥打；距離須標示「直線距離（非步行路線）」。
          source: proposal.md:62
        - id: US-4.6
          story_id: US-4
          text: WHEN 沒有已快取內容或要求快取範圍外的資料，THEN 說明缺少離線資料，保留仍可讀的內容。
          source: proposal.md:63
        - id: US-7.1
          story_id: US-7
          text: WHEN 我進入行程設定頁，THEN 可選日期、歷史路線、起點及目的地；新行程預設裝置當日日期與可用的目前位置，畫面不依選定日期宣稱店家正在營業。
          source: proposal.md:70
        - id: US-7.2
          story_id: US-7
          text: WHEN 我確認路線並明確選擇保存為歷史，THEN 才將日期、起迄點及選定方案存入本機歷史；初始歷史為空，保存失敗不得顯示成功。
          source: proposal.md:71
        - id: US-7.3
          story_id: US-7
          text: WHEN 我套用或刪除歷史行程，THEN 套用會還原站序與方案偏好、保留這次已選日期並重新計算，舊起點標為歷史起點；刪除後該筆不再出現。
          source: proposal.md:72
premise_version: 1
retry_of: []
